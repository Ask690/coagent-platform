# ============ MySQL 配置模板 ============
# 启用方式：./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# 或在环境变量中设置 SPRING_PROFILES_ACTIVE=mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coagent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
